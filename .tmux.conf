# --- General ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Screen migration: Ctrl-a prefix ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Truecolor support ---
# Ensure apps (e.g. Claude Code) detect truecolor
set -ga terminal-features ",xterm-256color:RGB"
set-environment -g COLORTERM truecolor

# --- Quality of life ---
set -g escape-time 10
set -g focus-events on
setw -g aggressive-resize on

# --- Vi copy mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run "sleep 0.3" \; send -X copy-selection-and-cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run "sleep 0.3" \; send -X copy-selection-and-cancel

# --- Intuitive splits (and open in current path) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Pane navigation (vim-style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Screen-style window switching ---
bind Space next-window
bind C-a last-window

# --- Toggle status bar (from Screen: Ctrl-a f / Ctrl-a F) ---
bind f set -g status off
bind F set -g status on

# --- Status bar ---
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour248"

# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=colour232,bg=colour214,bold] #S #[default] "

# Right: current path + hostname
set -g status-right-length 80
set -g status-right "#[fg=colour250] #{pane_current_path} #[fg=colour232,bg=colour75,bold] #H "

# Window tabs
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour232,bg=colour214,bold] #I:#W "
